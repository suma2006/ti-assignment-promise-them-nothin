
services:
  app1:
    build: .
    environment:
      - NODE_ID=app1
    expose:
      - "8000"

  app2:
    build: .
    environment:
      - NODE_ID=app2
    expose:
      - "8000"

  app3:
    build: .
    environment:
      - NODE_ID=app3
    expose:
      - "8000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2
      - app3
